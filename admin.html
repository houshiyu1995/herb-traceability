<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鏈崏婧簮 - 鏁版嵁绠＄悊鍚庡彴</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0eb;--surface:#fff;--text:#2c1810;--text2:#6b5b4f;
  --primary:#C8A45C;--primary-hover:#A68A4E;--primary-light:#F5E6CC;
  --green:#2E7D55;--green-light:#E8F5E9;
  --red:#c62828;--red-light:#FFEBEE;
  --border:#e0d5c7;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:280px;background:#2c1810;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header h2{font-size:1.2rem;margin-bottom:4px}
.sidebar-header small{font-size:.75rem;opacity:.6}
.sidebar-tools{padding:12px 16px;display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-tools button{flex:1;padding:6px 10px;border:none;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-add{background:var(--primary);color:#fff}
.btn-add:hover{background:var(--primary-hover)}
.btn-config{background:rgba(255,255,255,.1);color:#fff}
.btn-config:hover{background:rgba(255,255,255,.2)}
.herb-list{flex:1;overflow-y:auto;padding:8px}
.herb-list-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
  cursor:pointer;transition:all .2s;margin-bottom:2px;font-size:.88rem;
}
.herb-list-item:hover{background:rgba(255,255,255,.08)}
.herb-list-item.active{background:var(--primary);color:#fff}
.herb-list-item .emoji{font-size:1.2rem;width:28px;text-align:center}
.herb-list-item .info{flex:1;min-width:0}
.herb-list-item .name{font-weight:600;font-size:.85rem}
.herb-list-item .origin{font-size:.72rem;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.herb-list-item .del-btn{opacity:0;background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;transition:all .2s}
.herb-list-item:hover .del-btn{opacity:1}
.herb-list-item .del-btn:hover{background:rgba(255,0,0,.15)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar h3{font-size:1.05rem;color:var(--text)}
.topbar-actions{display:flex;gap:8px}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-save{background:var(--primary);color:#fff}
.btn-save:hover{background:var(--primary-hover)}
.btn-deploy{background:var(--green);color:#fff}
.btn-deploy:hover{background:#1B5E20}
.btn-preview{background:var(--text2);color:#fff}
.btn-preview:hover{background:var(--text)}
.content{flex:1;overflow-y:auto;padding:24px}

/* Tabs in editor */
.edit-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.edit-tab{
  padding:8px 16px;border:none;background:none;font-size:.85rem;font-weight:600;
  color:var(--text2);cursor:pointer;border-radius:6px 6px 0 0;transition:all .2s;
  white-space:nowrap;
}
.edit-tab:hover{color:var(--text);background:var(--primary-light)}
.edit-tab.active{color:var(--primary);background:var(--primary-light)}

/* Form styles */
.form-section{display:none}
.form-section.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;
  font-size:.88rem;font-family:inherit;background:var(--surface);transition:border-color .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Image preview */
.img-previews{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.img-preview-card{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.img-preview-card img{width:100%;height:100%;object-fit:cover}
.img-preview-card .idx{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:3px}

/* Dynamic lists */
.dynamic-list{margin-top:8px}
.dynamic-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
.dynamic-item .btn-remove{background:var(--red);color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:.75rem;cursor:pointer;margin-top:8px}
.dynamic-item .btn-remove:hover{background:#b71c1c}
.btn-add-item{background:var(--green-light);color:var(--green);border:1px dashed var(--green);padding:8px 16px;border-radius:6px;font-size:.82rem;cursor:pointer;width:100%;margin-top:6px;font-weight:600}
.btn-add-item:hover{background:var(--green);color:#fff}

/* Key-value editor */
.kv-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:start;margin-bottom:8px}
.kv-row input{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:.82rem}
.kv-row .btn-kv-del{background:var(--red);color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:.75rem}

/* Traceability editor */
.tr-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;position:relative}
.tr-item .tr-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tr-item .tr-order{font-weight:700;color:var(--primary);font-size:.9rem}
.tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Sales editor */
.sales-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.sales-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* QR Section in admin */
.qr-admin{display:flex;align-items:center;gap:20px;padding:16px;background:var(--surface);border-radius:8px;border:1px solid var(--border);margin-bottom:20px}
.qr-admin-info{flex:1}
.qr-admin-info h4{font-size:.95rem;margin-bottom:4px}
.qr-admin-info p{font-size:.78rem;color:var(--text2)}
.qr-admin-right{display:flex;align-items:center;gap:12px}
#adminQR canvas,#adminQR img{width:100px!important;height:100px!important}

/* Status bar */
.status-bar{background:var(--surface);padding:10px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--text2)}
.status-indicator{display:flex;align-items:center;gap:6px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status-dot.modified{background:#f0a030;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state h3{font-size:1.1rem;margin-bottom:6px;color:var(--text)}

/* Site config form */
.site-config-section{margin-bottom:20px}
.site-config-section h4{font-size:.95rem;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--primary-light)}
.config-features{margin-top:8px}

@media (max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;max-height:200px}
  .form-row,.form-row-3,.sales-grid{grid-template-columns:1fr}
  .qr-admin{flex-direction:column;text-align:center}
  .edit-tabs{overflow-x:auto;flex-wrap:nowrap}
  .edit-tab{flex-shrink:0}
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>馃尶 绠＄悊鍚庡彴</h2>
      <small>鏈崏婧簮鏁版嵁绠＄悊</small>
    </div>
    <div class="sidebar-tools">
      <button class="btn-add" onclick="addHerb()">+ 鏂板鑽潗</button>
      <button class="btn-config" onclick="showSiteConfig()">鈿?缃戠珯閰嶇疆</button>
    </div>
    <div class="herb-list" id="herbList">
      <div style="padding:20px;text-align:center;opacity:.5">鍔犺浇涓?..</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h3 id="editorTitle">璇烽€夋嫨鑽潗鎴栧姛鑳?/h3>
      <div class="topbar-actions" id="topbarActions">
        <button class="btn btn-preview" onclick="previewSite()">馃憗 棰勮缃戠珯</button>
        <button class="btn btn-save" onclick="saveLocal()">馃捑 淇濆瓨鏈湴</button>
        <button class="btn btn-deploy" onclick="deployToGitHub()">馃殌 閮ㄧ讲鍒扮嚎涓?/button>
      </div>
    </div>
    <div class="content" id="mainContent">
      <div class="empty-state">
        <div class="icon">馃搵</div>
        <h3>璇蜂粠宸︿晶閫夋嫨瑕佺紪杈戠殑鍐呭</h3>
        <p>閫変腑鑽潗鍚庡彲浠ョ紪杈戣鑽潗鐨勬墍鏈変俊鎭紱鐐瑰嚮銆岀綉绔欓厤缃€嶅彲浠ヤ慨鏀圭珯鐐瑰叏灞€璁剧疆</p>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">鏁版嵁宸插姞杞?/span>
      </div>
      <span id="statusInfo"></span>
    </div>
  </div>
</div>

<script>
// ===== GLOBAL STATE =====
let DATA = { siteConfig: {}, herbs: [] };
let currentHerbId = null;
let isSiteConfig = false;
let isModified = false;
let currentEditTab = 0;
const GITHUB_USER = 'houshiyu1995';
const GITHUB_REPO = 'herb-traceability';
let GITHUB_TOKEN = localStorage.getItem('gh_token') || '';
const BASE_URL = 'https://houshiyu1995.github.io/herb-traceability/';

// ===== INIT =====
async function init() {
  const res = await fetch('data.json');
  DATA = await res.json();
  renderHerbList();
  updateStatus('鏁版嵁鍔犺浇瀹屾垚', false);
}

function renderHerbList() {
  const list = document.getElementById('herbList');
  if (DATA.herbs.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;opacity:.5">鏆傛棤鑽潗鏁版嵁</div>';
    return;
  }
  list.innerHTML = DATA.herbs.map(h => `
    <div class="herb-list-item ${currentHerbId === h.id && !isSiteConfig ? 'active' : ''}" onclick="selectHerb('${h.id}')">
      <span class="emoji">${h.emoji||'馃尶'}</span>
      <div class="info">
        <div class="name">${h.name}</div>
        <div class="origin">${h.origin}</div>
      </div>
      <button class="del-btn" onclick="event.stopPropagation();deleteHerb('${h.id}')" title="鍒犻櫎">鉁?/button>
    </div>
  `).join('');
}

// ===== SELECT HERB =====
function selectHerb(id) {
  currentHerbId = id;
  isSiteConfig = false;
  currentEditTab = 0;
  const h = DATA.herbs.find(x => x.id === id);
  if (!h) return;
  document.getElementById('editorTitle').textContent = `鉁忥笍 缂栬緫锛?{h.name}锛?{h.batch}锛塦;
  renderHerbList();
  renderHerbEditor(h);
}

function getCurrentHerb() {
  return DATA.herbs.find(h => h.id === currentHerbId);
}

// ===== ADD / DELETE HERB =====
function addHerb() {
  const id = prompt('璇疯緭鍏ヨ嵂鏉愯嫳鏂嘔D锛堝锛歝huanxiong锛岀敤浜嶶RL锛夛細');
  if (!id) return;
  if (DATA.herbs.find(h => h.id === id)) { alert('璇D宸插瓨鍦紒'); return; }
  const name = prompt('璇疯緭鍏ヨ嵂鏉愬悕绉帮紙濡傦細宸濊妿锛夛細') || '鏂拌嵂鏉?;
  const newHerb = {
    id, name, latin: '', category: '', origin: '', batch: '', year: new Date().getFullYear().toString(),
    colors: ['#8D6E63','#6D4C41'], emoji: '馃尶',
    imgs: ['','','',''],
    productInfo: { '鍝佸悕': name, '瑙勬牸': '', '鎵瑰彿': '', '浜у湴': '', '鐢熶骇鏃ユ湡': '', '鏈夋晥鏈熻嚦': '', '鍑€鍚噺': '', '璐棌鏉′欢': '', '鎵ц鏍囧噯': '' },
    productionInfo: { '绉嶆鏂瑰紡': '', '绉嶆骞撮檺': '', '绉嶆鐜': '', '鍦熷￥绫诲瀷': '', '閲囨敹鏃堕棿': '', '鍔犲伐宸ヨ壓': '', '鍔犲伐浼佷笟': '', '鍔犲伐鏃ユ湡': '' },
    traceability: [{ stage: '閫夌鑲茶嫍', location: '', time: '', desc: '', operator: '', status: 'done' }],
    qualityInfo: { '妫€娴嬫爣鍑?: '', '妫€娴嬫満鏋?: '', '鎶ュ憡缂栧彿': '', '妫€娴嬬粨璁?: '' },
    enterpriseInfo: { '浼佷笟鍚嶇О': '', '缁熶竴绀句細淇＄敤浠ｇ爜': '', '娉曞畾浠ｈ〃浜?: '', '娉ㄥ唽璧勬湰': '', '鎴愮珛鏃ユ湡': '', '娉ㄥ唽鍦板潃': '', '鑱旂郴鐢佃瘽': '', '鐢熶骇璁稿彲璇佸彿': '', '缁忚惀鑼冨洿': '' },
    salesTraceability: []
  };
  DATA.herbs.push(newHerb);
  currentHerbId = id;
  isModified = true;
  renderHerbList();
  selectHerb(id);
}

function deleteHerb(id) {
  const h = DATA.herbs.find(x => x.id === id);
  if (!confirm(`纭畾鍒犻櫎"${h.name}"鍚楋紵姝ゆ搷浣滀笉鍙挙閿€锛乣)) return;
  DATA.herbs = DATA.herbs.filter(x => x.id !== id);
  if (currentHerbId === id) {
    currentHerbId = null;
    document.getElementById('editorTitle').textContent = '璇烽€夋嫨鑽潗鎴栧姛鑳?;
    document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="icon">馃搵</div><h3>璇蜂粠宸︿晶閫夋嫨瑕佺紪杈戠殑鍐呭</h3></div>';
  }
  isModified = true;
  renderHerbList();
}

// ===== SITE CONFIG =====
function showSiteConfig() {
  isSiteConfig = true;
  currentHerbId = null;
  currentEditTab = 0;
  document.getElementById('editorTitle').textContent = '鈿?缃戠珯鍏ㄥ眬閰嶇疆';
  renderHerbList();
  renderSiteConfigEditor();
}

function renderSiteConfigEditor() {
  const sc = DATA.siteConfig;
  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="edit-tabs">
      <button class="edit-tab active" onclick="switchConfigTab(0)">鍩烘湰淇℃伅</button>
      <button class="edit-tab" onclick="switchConfigTab(1)">椤佃剼淇℃伅</button>
      <button class="edit-tab" onclick="switchConfigTab(2)">鐗硅壊鍔熻兘</button>
      <button class="edit-tab" onclick="switchConfigTab(3)">鍒嗙被涓庝骇鍦?/button>
    </div>
    <div id="configTabContent"></div>
  `;
  switchConfigTab(0);
}

function switchConfigTab(idx) {
  currentEditTab = idx;
  const sc = DATA.siteConfig;
  let html = '';
  if (idx === 0) {
    html = `
      <div class="form-section active">
        <div class="form-group"><label>缃戠珯鏍囬</label><input value="${esc(sc.title)}" onchange="updateConfig('title',this.value)"></div>
        <div class="form-group"><label>鍓爣棰?/label><input value="${esc(sc.subtitle)}" onchange="updateConfig('subtitle',this.value)"></div>
        <div class="form-group"><label>椤堕儴妯箙鏂囧瓧</label><input value="${esc(sc.banner)}" onchange="updateConfig('banner',this.value)"></div>
      </div>`;
  } else if (idx === 1) {
    const f = sc.footer || {};
    html = `
      <div class="form-section active">
        <div class="form-group"><label>鍏充簬鎴戜滑鎻忚堪</label><textarea onchange="updateFooter('about',this.value)">${esc(f.about||'')}</textarea></div>
        <div class="form-group"><label>鐗堟潈淇℃伅</label><input value="${esc(f.copyright||'')}" onchange="updateFooter('copyright',this.value)"></div>
        <div class="form-group"><label>鑱旂郴閭</label><input value="${esc((f.contact||{}).email||'')}" onchange="updateFooterContact('email',this.value)"></div>
        <div class="form-group"><label>鑱旂郴鐢佃瘽</label><input value="${esc((f.contact||{}).phone||'')}" onchange="updateFooterContact('phone',this.value)"></div>
        <div class="form-group"><label>宸ヤ綔鏃堕棿</label><input value="${esc((f.contact||{}).hours||'')}" onchange="updateFooterContact('hours',this.value)"></div>
        <div class="form-group">
          <label>杩芥函鏈嶅姟鑿滃崟锛堟瘡琛屼竴涓級</label>
          <textarea onchange="updateFooterList('services',this.value)" style="min-height:80px">${(f.services||[]).join('\n')}</textarea>
        </div>
        <div class="form-group">
          <label>鍏充簬鎴戜滑鑿滃崟锛堟瘡琛屼竴涓級</label>
          <textarea onchange="updateFooterList('company',this.value)" style="min-height:80px">${(f.company||[]).join('\n')}</textarea>
        </div>
      </div>`;
  } else if (idx === 2) {
    const features = sc.features || [];
    html = `<div class="form-section active config-features">`;
    features.forEach((f,i) => {
      html += `
        <div class="dynamic-item">
          <div class="form-row-3">
            <div class="form-group"><label>鍥炬爣锛圗moji锛?/label><input value="${esc(f.icon)}" onchange="updateFeature(${i},'icon',this.value)"></div>
            <div class="form-group"><label>鏍囬</label><input value="${esc(f.title)}" onchange="updateFeature(${i},'title',this.value)"></div>
            <div class="form-group"><label>鎻忚堪</label><input value="${esc(f.desc)}" onchange="updateFeature(${i},'desc',this.value)"></div>
          </div>
          <button class="btn-remove" onclick="removeFeature(${i})">鍒犻櫎姝ら」</button>
        </div>`;
    });
    html += `<button class="btn-add-item" onclick="addFeature()">+ 娣诲姞鐗硅壊鍔熻兘</button></div>`;
  } else if (idx === 3) {
    html = `
      <div class="form-section active">
        <div class="form-group"><label>鑽潗鍒嗙被锛堟瘡琛屼竴涓級</label><textarea onchange="updateConfig('categories',this.value.split('\n').filter(Boolean))" style="min-height:120px">${(sc.categories||[]).join('\n')}</textarea></div>
        <div class="form-group"><label>浜у湴鍒楄〃锛堟瘡琛屼竴涓級</label><textarea onchange="updateConfig('origins',this.value.split('\n').filter(Boolean))" style="min-height:120px">${(sc.origins||[]).join('\n')}</textarea></div>
      </div>`;
  }
  document.getElementById('configTabContent').innerHTML = html;
}

function updateConfig(key, val) { DATA.siteConfig[key] = val; markModified(); }
function updateFooter(key, val) { if(!DATA.siteConfig.footer) DATA.siteConfig.footer={}; DATA.siteConfig.footer[key]=val; markModified(); }
function updateFooterContact(key, val) { if(!DATA.siteConfig.footer) DATA.siteConfig.footer={}; if(!DATA.siteConfig.footer.contact) DATA.siteConfig.footer.contact={}; DATA.siteConfig.footer.contact[key]=val; markModified(); }
function updateFooterList(key, val) { if(!DATA.siteConfig.footer) DATA.siteConfig.footer={}; DATA.siteConfig.footer[key]=val.split('\n').filter(Boolean); markModified(); }
function updateFeature(i, key, val) { DATA.siteConfig.features[i][key]=val; markModified(); }

function renderHerbEditor(h) {
  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="edit-tabs">
      <button class="edit-tab active" onclick="switchHerbTab(0)">鍩烘湰淇℃伅</button>
      <button class="edit-tab" onclick="switchHerbTab(1)">浜у搧淇℃伅</button>
      <button class="edit-tab" onclick="switchHerbTab(2)">鐢熶骇淇℃伅</button>
      <button class="edit-tab" onclick="switchHerbTab(3)">鑽潗杩芥函</button>

      <button class="edit-tab" onclick="switchHerbTab(5)">浼佷笟淇℃伅</button>
      <button class="edit-tab" onclick="switchHerbTab(6)">閿€鍞函婧?/button>
      <button class="edit-tab" onclick="switchHerbTab(7)">鍥剧墖 & 浜岀淮鐮?/button>
    </div>
    <div id="tabContent"></div>
  `;
  switchHerbTab(0);

function switchHerbTab(idx) {
  currentEditTab = idx;
  const h = getCurrentHerb();
  if (!h) return;
  let html = '';

  switch(idx) {
    case 0: html = renderBasicEditor(h); break;
    case 1: html = renderKVEditor(h, 'productInfo', '浜у搧淇℃伅'); break;
    case 2: html = renderKVEditor(h, 'productionInfo', '鐢熶骇淇℃伅'); break;
    case 3: html = renderTraceEditor(h); break;
    case 4: html = renderKVEditor(h, 'qualityInfo', '璐ㄦ淇℃伅'); break;
    case 5: html = renderKVEditor(h, 'enterpriseInfo', '浼佷笟淇℃伅'); break;
    case 6: html = renderSalesEditor(h); break;
    case 7: html = renderImageQREditor(h); break;
  }

  document.getElementById('tabContent').innerHTML = html;

  // Update tab active state
  const tabs = document.querySelectorAll('.edit-tab');
  tabs.forEach((t,i) => t.classList.toggle('active', i===idx));

  // Generate QR if on QR tab
  if (idx === 7) setTimeout(generateAdminQR, 200);
}

// ===== UPDATE HELPERS =====
function updateHerb(key, val) { const h = getCurrentHerb(); if(h) { h[key] = val; markModified(); } }
function updateColor(idx, val) { const h = getCurrentHerb(); if(h && h.colors) { h.colors[idx] = val; markModified(); } }
function updateHerbImage(idx, val) { const h = getCurrentHerb(); if(h) { h.imgs[idx] = val; markModified(); renderHerbEditor(h); switchHerbTab(7); } }
function updateTraceField(i, key, val) { const h = getCurrentHerb(); if(h && h.traceability) { h.traceability[i][key] = val; markModified(); } }
function deleteTrace(i) { const h = getCurrentHerb(); if(h && h.traceability) { h.traceability.splice(i,1); markModified(); renderHerbEditor(h); switchHerbTab(3); } }
function addTrace() { const h = getCurrentHerb(); if(h) { if(!h.traceability) h.traceability=[]; h.traceability.push({stage:'鏂扮幆鑺?,location:'',time:'',desc:'',operator:'',status:'done'}); markModified(); renderHerbEditor(h); switchHerbTab(3); } }
function updateSaleField(i, key, val) { const h = getCurrentHerb(); if(h && h.salesTraceability) { h.salesTraceability[i][key] = val; markModified(); } }
function deleteSale(i) { const h = getCurrentHerb(); if(h && h.salesTraceability) { h.salesTraceability.splice(i,1); markModified(); renderHerbEditor(h); switchHerbTab(6); } }
function addSale() { const h = getCurrentHerb(); if(h) { if(!h.salesTraceability) h.salesTraceability=[]; h.salesTraceability.push({date:new Date().toISOString().slice(0,10),batch:'',quantity:'',buyer:'',channel:'',region:'',status:'寰呭彂璐?,notes:''}); markModified(); renderHerbEditor(h); switchHerbTab(6); } }

function updateKV(field, i, type, val) {
  const h = getCurrentHerb();
  if (!h || !h[field]) return;
  const entries = Object.entries(h[field]);
  if (i >= entries.length) return;
  const oldKey = entries[i][0];
  const oldVal = entries[i][1];
  if (type === 'key') {
    delete h[field][oldKey];
    h[field][val] = oldVal;
  } else {
    h[field][oldKey] = val;
  }
  markModified();
}

function deleteKV(field, i) {
  const h = getCurrentHerb();
  if (!h || !h[field]) return;
  const entries = Object.entries(h[field]);
  if (i >= entries.length) return;
  delete h[field][entries[i][0]];
  markModified();
  renderHerbEditor(h);
  switchHerbTab(currentEditTab);
}

function addKV(field) {
  const h = getCurrentHerb();
  if (!h) return;
  if (!h[field]) h[field] = {};
  h[field]['鏂板瓧娈?] = '';
  markModified();
  renderHerbEditor(h);
  switchHerbTab(currentEditTab);
}

// ===== QR CODE IN ADMIN =====
function generateAdminQR() {
  const container = document.getElementById('adminQR');
  if (!container) return;
  container.innerHTML = '';
  const h = getCurrentHerb();
  if (!h) return;
  const url = BASE_URL + '?id=' + h.id;
  try { new QRCode(container, { text: url, width: 100, height: 100, colorDark: '#2c1810', colorLight: '#FFFFFF' }); }
  catch(e) { container.innerHTML = '<div style="width:100px;height:100px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:2rem">馃摫</div>'; }
}

function downloadAdminQR() {
  const canvas = document.querySelector('#adminQR canvas');
  if (!canvas) return alert('浜岀淮鐮佹湭鐢熸垚锛岃绋嶅悗閲嶈瘯');
  const h = getCurrentHerb();
  const link = document.createElement('a');
  link.download = `QR-${h?h.id:'herb'}-${h?h.name:''}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ===== STATUS =====
function markModified() {
  isModified = true;
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (dot) dot.className = 'status-dot modified';
  if (text) text.textContent = '鏁版嵁宸蹭慨鏀癸紙鏈繚瀛橈級';
}

function updateStatus(text, modified) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (modified ? ' modified' : '');
}

// ===== SAVE =====
function saveLocal() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);

  // Also backup to localStorage
  try { localStorage.setItem('herb_data_backup', json); }
  catch(e) { console.warn('localStorage backup failed', e); }

  isModified = false;
  updateStatus('宸蹭繚瀛樺埌鏈湴锛坉ata.json 宸蹭笅杞斤級', false);
}

// ===== DEPLOY =====
async function deployToGitHub() {
  if (!GITHUB_TOKEN) {
    GITHUB_TOKEN = prompt('璇疯緭鍏?GitHub Personal Access Token锛堜粎淇濆瓨鍦ㄦ湰鍦版祻瑙堝櫒锛屼笉浼氫笂浼狅級锛?);
    if (!GITHUB_TOKEN) return;
    localStorage.setItem('gh_token', GITHUB_TOKEN);
  }

  const json = JSON.stringify(DATA, null, 2);
  const content = btoa(unescape(encodeURIComponent(json)));
  const headers = { Authorization: 'Bearer ' + GITHUB_TOKEN, 'User-Agent': 'WorkBuddy-Admin' };

  updateStatus('姝ｅ湪閮ㄧ讲 data.json...', true);

  try {
    // Get current SHA
    let sha = '';
    try {
      const r = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`, { headers });
      if (r.ok) { const d = await r.json(); sha = d.sha; }
    } catch(e) {}

    const body = { message: 'Update data from admin panel', content, branch: 'main' };
    if (sha) body.sha = sha;

    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`, {
      method: 'PUT', headers, body: JSON.stringify(body)
    });

    if (res.ok) {
      isModified = false;
      updateStatus('鉁?閮ㄧ讲鎴愬姛锛?-2鍒嗛挓鍚庣嚎涓婄敓鏁?, false);
    } else {
      const err = await res.json();
      if (err.message && err.message.includes('Bad credentials')) {
        GITHUB_TOKEN = '';
        localStorage.removeItem('gh_token');
        updateStatus('鉂?Token 澶辨晥锛岃閲嶆柊閮ㄧ讲骞惰緭鍏ユ柊 Token', true);
      } else {
        updateStatus('鉂?閮ㄧ讲澶辫触: ' + (err.message||'鏈煡閿欒'), true);
      }
    }
  } catch(e) {
    updateStatus('鉂?缃戠粶閿欒锛岃妫€鏌ョ綉缁滃悗閲嶈瘯', true);
  }
}
